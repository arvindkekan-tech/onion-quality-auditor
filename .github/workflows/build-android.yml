name: Build Android APK

on:
  push:
    branches: [main, frontend/arvind]
  pull_request:
    branches: [main, frontend/arvind]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK Exists
        run: |
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: APK file was not generated at android/app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
          echo "Verified APK output:"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: onivis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/frontend/arvind' || github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-latest
          name: ONIVIS Android APK (Latest)
          body: |
            ### ONIVIS Android Application
            Autonomous Android delivery for judges.
            
            - **Package**: `com.onivis.app`
            - **Backend API**: `https://onivis-api.onrender.com`
            - **ML Pipeline**: Real production ML models (YOLO detection + EfficientNet grading)
            - **Camera**: Native Android camera integration via WebRTC/HTML5 MediaCapture
            
            Download `app-debug.apk` below and install directly on any Android device (Android 7.0+ / API 24+).
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
